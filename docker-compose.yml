services:
  postgres:
    image: postgres:16-alpine
    container_name: nodeargus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nodeargus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nodeargus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nodeargus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nodeargus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    working_dir: /app
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_ASYNC_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-data/GeoLite2-City.mmdb}
      GEOIP_LICENSE_KEY: ${GEOIP_LICENSE_KEY:-}
      GEOIP_MIRROR_URL: ${GEOIP_MIRROR_URL:-}
      GEOIP_AUTO_UPDATE: ${GEOIP_AUTO_UPDATE:-false}
      ALLOW_ACTIVE_RECON: ${ALLOW_ACTIVE_RECON:-false}
      AMASS_CONF_PATH: ${AMASS_CONF_PATH:-/root/.config/amass/config.yaml}
      AMASS_WORDLIST_PATH: ${AMASS_WORDLIST_PATH:-/usr/share/wordlists/amass/subdomains-top1mil-5000.txt}
      ALLOW_WAF_BYPASS: ${ALLOW_WAF_BYPASS:-false}
      WAF_BYPASS_RATE_LIMIT: ${WAF_BYPASS_RATE_LIMIT:-150}
      WAF_BYPASS_CONCURRENCY: ${WAF_BYPASS_CONCURRENCY:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nodeargus-net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nodeargus-celery-worker
    restart: unless-stopped
    user: root
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: celery -A app.celery_worker worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./data:/app/data
    working_dir: /app
    environment:
      TZ: Europe/Moscow
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_ASYNC_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-data/GeoLite2-City.mmdb}
      GEOIP_LICENSE_KEY: ${GEOIP_LICENSE_KEY:-}
      GEOIP_MIRROR_URL: ${GEOIP_MIRROR_URL:-}
      GEOIP_AUTO_UPDATE: ${GEOIP_AUTO_UPDATE:-false}
      ALLOW_ACTIVE_RECON: ${ALLOW_ACTIVE_RECON:-false}
      AMASS_CONF_PATH: ${AMASS_CONF_PATH:-/root/.config/amass/config.yaml}
      AMASS_WORDLIST_PATH: ${AMASS_WORDLIST_PATH:-/usr/share/wordlists/amass/subdomains-top1mil-5000.txt}
      ALLOW_WAF_BYPASS: ${ALLOW_WAF_BYPASS:-false}
      WAF_BYPASS_RATE_LIMIT: ${WAF_BYPASS_RATE_LIMIT:-150}
      WAF_BYPASS_CONCURRENCY: ${WAF_BYPASS_CONCURRENCY:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nodeargus-net

volumes:
  postgres_data:
  redis_data:

networks:
  nodeargus-net:
    name: nodeargus-net
    driver: bridge
